<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatter</title>
<style>
  :root {
    --green: #008069; --green-dark: #075e54; --accent: #25d366;
    --bg: #efeae2; --panel: #ffffff; --out: #d9fdd3; --in: #ffffff;
    --text: #111b21; --muted: #667781; --line: #e9edef;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: #d1d7db; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- Login screen ---------- */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 16px;
          background: linear-gradient(var(--green) 0 220px, #d1d7db 220px); }
  .auth-card { width: 100%; max-width: 400px; background: var(--panel); border-radius: 12px;
               padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.15); }
  .auth-card h1 { font-size: 26px; color: var(--green-dark); }
  .auth-card p.sub { color: var(--muted); margin: 4px 0 18px; font-size: 14px; }
  .tabs { display: flex; background: #f0f2f5; border-radius: 8px; padding: 4px; margin-bottom: 18px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .tabs button.active { background: #fff; color: var(--green-dark); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .auth-card input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; }
  .primary { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:hover { background: var(--green-dark); }
  #authError { color: #c0392b; font-size: 14px; min-height: 20px; margin-top: 10px; }

  /* ---------- App layout ---------- */
  #app { height: 100%; max-width: 1400px; margin: 0 auto; display: flex; background: var(--panel); box-shadow: 0 0 20px rgba(0,0,0,.12); }
  .sidebar { width: 360px; border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  .side-head { background: #f0f2f5; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .side-head .who { flex: 1; min-width: 0; }
  .side-head .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-head .who small { color: var(--muted); }
  .link-btn { border: 0; background: none; color: var(--green-dark); cursor: pointer; font-weight: 600; }
  .list { overflow-y: auto; flex: 1; }
  .list h3 { font-size: 13px; color: var(--green); padding: 14px 16px 6px; font-weight: 600; }
  .contact { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .contact:hover { background: #f5f6f6; }
  .contact.active { background: #f0f2f5; }
  .contact .info { flex: 1; min-width: 0; }
  .contact .info b { display: block; }
  .contact .info small { color: var(--muted); }
  .badge { background: var(--accent); color: #fff; font-size: 12px; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; font-weight: 600; }

  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; flex-shrink: 0; }

  /* ---------- Chat pane ---------- */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .chat-head { background: #f0f2f5; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .chat-head .title b { display: block; }
  .chat-head .title small { color: var(--muted); }
  .back { display: none; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  #messages { flex: 1; overflow-y: auto; padding: 16px 6%; display: flex; flex-direction: column; gap: 4px;
              background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 18px 18px; }
  .empty { margin: auto; background: #fff8dc; color: #54656f; padding: 10px 16px; border-radius: 8px; font-size: 14px; text-align: center; }
  .msg { max-width: 75%; padding: 6px 9px 4px; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,.13); word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.in { align-self: flex-start; background: var(--in); border-top-left-radius: 0; }
  .msg.out { align-self: flex-end; background: var(--out); border-top-right-radius: 0; }
  .msg .sender { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  .msg .text { white-space: pre-wrap; }
  .msg .time { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  #typing { height: 22px; padding: 0 6%; font-size: 13px; color: var(--green-dark); font-style: italic; }
  .composer { background: #f0f2f5; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  .composer input { flex: 1; padding: 12px 16px; border: 0; border-radius: 22px; }
  .send { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--green); color: #fff; cursor: pointer; font-size: 18px; }
  .send:hover { background: var(--green-dark); }

  /* ---------- Advanced features ---------- */
  .search { margin: 8px 12px; width: calc(100% - 24px); padding: 9px 14px; border: 0; border-radius: 8px; background: #f0f2f5; }
  .icon { border: 0; background: none; font-size: 22px; cursor: pointer; padding: 4px; }
  #emoji { background: #f0f2f5; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid var(--line); }
  #emoji button { border: 0; background: none; font-size: 24px; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
  #emoji button:hover { background: rgba(0,0,0,.08); }
  .pic { display: block; max-width: 100%; max-height: 260px; border-radius: 6px; margin-bottom: 4px; cursor: zoom-in; }
  .deleted { color: var(--muted); font-style: italic; }
  .tick { color: #8696a0; }
  .tick.read { color: #53bdeb; }
  .del { border: 0; background: none; cursor: pointer; opacity: 0; font-size: 12px; }
  .msg:hover .del { opacity: .7; }
  @media (hover: none) { .del { opacity: .6; } }
  body.dark { --panel:#111b21; --bg:#0b141a; --out:#005c4b; --in:#202c33; --text:#e9edef; --muted:#8696a0; --line:#222d34; background:#0b141a; }
  body.dark .side-head, body.dark .chat-head, body.dark .composer, body.dark #emoji, body.dark .contact.active, body.dark .search { background:#202c33; }
  body.dark .contact:hover { background:#1a252c; }
  body.dark .composer input, body.dark .search { color:var(--text); }
  body.dark .composer input { background:#2a3942; }
  body.dark .empty { background:#182229; color:var(--muted); }
  body.dark #messages { background-image: none; }

  /* ---------- Mobile: one pane at a time ---------- */
  @media (max-width: 760px) {
    .sidebar { width: 100%; border-right: 0; }
    .chat { display: none; }
    #app.chat-open .sidebar { display: none; }
    #app.chat-open .chat { display: flex; }
    .back { display: block; }
    .msg { max-width: 88%; }
    #messages { padding: 12px 10px; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="auth">
  <div class="auth-card">
    <h1>Chatter</h1>
    <p class="sub">Chat with everyone or message one person privately.</p>
    <div class="tabs">
      <button class="active" data-mode="guest">Just a name</button>
      <button data-mode="login">Log in</button>
      <button data-mode="register">Sign up</button>
    </div>
    <input id="fName" placeholder="Your name" maxlength="20" autocomplete="nickname">
    <input id="fEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="fPass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <button class="primary" id="authBtn">Start chatting</button>
    <div id="authError" role="alert"></div>
  </div>
</div>

<!-- ============ CHAT APP ============ -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="side-head">
      <div class="avatar" id="meAvatar"></div>
      <div class="who"><b id="meName"></b><small id="meType"></small></div>
      <button class="link-btn" id="theme" title="Dark mode">&#127769;</button>
      <button class="link-btn" id="logout">Leave</button>
    </div>
    <input class="search" id="search" placeholder="Search people" autocomplete="off">
    <div class="list" id="contacts"></div>
  </aside>

  <section class="chat">
    <div class="chat-head">
      <button class="back" id="backBtn" aria-label="Back to chats">&larr;</button>
      <div class="avatar" id="chatAvatar"></div>
      <div class="title"><b id="chatTitle"></b><small id="chatSub"></small></div>
    </div>
    <div id="messages"></div>
    <div id="typing"></div>
    <div id="emoji" class="hidden"></div>
    <div class="composer">
      <button class="icon" id="emojiBtn" aria-label="Emoji">&#128522;</button>
      <button class="icon" id="attachBtn" aria-label="Send photo">&#128206;</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
      <input id="input" placeholder="Type a message" autocomplete="off" maxlength="1000">
      <button class="send" id="sendBtn" aria-label="Send">&#10148;</button>
    </div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ============ State ============ */
const $ = (id) => document.getElementById(id);
let socket, me;
let users = [];               // people currently online
let current = 'public';       // 'public' or a user id
const chats = { public: [] }; // messages per conversation
const unread = {};            // unread counters per conversation
const names = {};             // remember names (even after someone leaves)
let mode = 'guest';           // which login tab is active

/* ============ Helpers ============ */
const colors = ['#e17076', '#faa774', '#7bc862', '#6ec9cb', '#65aadd', '#a695e7', '#ee7aae'];
const colorFor = (s) => colors[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
const initials = (n) => (n || '?').trim().slice(0, 2).toUpperCase();
const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function setAvatar(el, name, isGroup) {
  el.textContent = isGroup ? '\u{1F465}' : initials(name);
  el.style.background = isGroup ? '#00a884' : colorFor(name);
}

/* ============ Login screen ============ */
document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
    $('fName').classList.toggle('hidden', mode === 'login');
    $('fEmail').classList.toggle('hidden', mode === 'guest');
    $('fPass').classList.toggle('hidden', mode === 'guest');
    $('authBtn').textContent = mode === 'guest' ? 'Start chatting' : mode === 'login' ? 'Log in' : 'Create account';
    $('authError').textContent = '';
  };
});
document.querySelector('.tabs button[data-mode="guest"]').click();

async function submitAuth() {
  $('authError').textContent = '';
  const name = $('fName').value.trim(), email = $('fEmail').value.trim(), password = $('fPass').value;

  if (mode === 'guest') {
    if (!name) return ($('authError').textContent = 'Enter a name to continue.');
    return connect({ guestName: name });
  }
  try {
    const res = await fetch('/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) return ($('authError').textContent = data.error);
    localStorage.setItem('chat-token', data.token);
    connect({ token: data.token });
  } catch {
    $('authError').textContent = 'Cannot reach the server. Check your connection.';
  }
}
$('authBtn').onclick = submitAuth;
['fName', 'fEmail', 'fPass'].forEach((id) => $(id).addEventListener('keydown', (e) => e.key === 'Enter' && submitAuth()));

/* ============ Socket connection ============ */
function connect(auth) {
  if (socket) socket.disconnect();
  socket = io({ auth });

  socket.on('connect_error', (err) => {
    $('authError').textContent = err.message;
    if (auth.token) localStorage.removeItem('chat-token');
    socket.disconnect();
  });

  socket.on('me', (u) => {
    me = u;
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('meName').textContent = u.name;
    $('meType').textContent = u.guest ? 'Guest' : 'Registered';
    setAvatar($('meAvatar'), u.name);
    openChat(current === 'public' ? 'public' : current, true);
  });

  socket.on('users', (list) => {
    users = list.filter((x) => x.id !== me.id);
    users.forEach((x) => (names[x.id] = x.name));
    renderContacts();
    updateHeader();
  });

  socket.on('history:public', (list) => { chats.public = list; if (current === 'public') renderMessages(); });

  socket.on('message:public', (m) => receive('public', m));
  socket.on('message:private', (m) => receive(m.from === me.id ? m.to : m.from, m));

  // Other person opened our chat -> turn ticks blue
  socket.on('read', ({ by }) => {
    (chats[by] || []).forEach((m) => { if (m.from === me.id) m.status = 'read'; });
    if (current === by) renderMessages();
  });

  // A message was deleted for everyone
  socket.on('message:deleted', ({ id, to, from }) => {
    const key = to === null ? 'public' : from === me.id ? to : from;
    const m = (chats[key] || []).find((x) => x.id === id);
    if (m) { m.deleted = true; m.text = ''; m.image = null; }
    if (current === key) renderMessages();
    renderContacts();
  });

  socket.on('typing', ({ from, name, to }) => {
    const relevant = to === null ? current === 'public' : current === from;
    if (!relevant) return;
    $('typing').textContent = name + ' is typing…';
    clearTimeout(showTyping.t);
    showTyping.t = setTimeout(() => ($('typing').textContent = ''), 1500);
  });
}
const showTyping = {};

function receive(key, m) {
  names[m.from] = m.fromName;
  (chats[key] = chats[key] || []).push(m);
  if (m.from !== me.id && (key !== current || document.hidden)) beep();
  if (key === current) {
    renderMessages();
    if (key !== 'public' && m.from !== me.id) socket.emit('read', key);
  } else if (m.from !== me.id) unread[key] = (unread[key] || 0) + 1;
  renderContacts();
}

/* ============ Rendering ============ */
function renderContacts() {
  const box = $('contacts');
  box.innerHTML = '';
  const add = (key, name, sub, isGroup) => {
    const row = document.createElement('div');
    row.className = 'contact' + (key === current ? ' active' : '');
    row.innerHTML = '<div class="avatar"></div><div class="info"><b></b><small></small></div>';
    setAvatar(row.querySelector('.avatar'), name, isGroup);
    row.querySelector('b').textContent = name;
    const last = (chats[key] || []).slice(-1)[0];
    row.querySelector('small').textContent = last ? (last.deleted ? '\u{1F6AB} Deleted' : last.text || '\u{1F4F7} Photo') : sub;
    if (unread[key]) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = unread[key];
      row.appendChild(b);
    }
    row.onclick = () => openChat(key);
    box.appendChild(row);
  };
  const h1 = document.createElement('h3'); h1.textContent = 'Group'; box.appendChild(h1);
  add('public', 'Everyone', 'Public room', true);
  const h2 = document.createElement('h3'); h2.textContent = `People online (${users.length})`; box.appendChild(h2);
  if (!users.length) {
    const p = document.createElement('div');
    p.className = 'empty'; p.style.margin = '12px 16px';
    p.textContent = 'No one else is online yet. Open the app in another tab to test.';
    box.appendChild(p);
  }
  const q = $('search').value.trim().toLowerCase();
  users.filter((u) => u.name.toLowerCase().includes(q)).forEach((u) => add(u.id, u.name, u.guest ? 'Guest' : 'Registered', false));
}

function updateHeader() {
  if (!me) return;
  if (current === 'public') {
    $('chatTitle').textContent = 'Everyone';
    $('chatSub').textContent = users.length + 1 + ' online';
    setAvatar($('chatAvatar'), 'Everyone', true);
  } else {
    const nm = names[current] || 'Unknown';
    $('chatTitle').textContent = nm;
    $('chatSub').textContent = users.some((u) => u.id === current) ? 'online' : 'offline';
    setAvatar($('chatAvatar'), nm, false);
  }
}

function renderMessages() {
  const box = $('messages');
  box.innerHTML = '';
  const list = chats[current] || [];
  if (!list.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = current === 'public' ? 'No messages yet. Say hello to everyone!' : 'No messages yet. Send the first one.';
    box.appendChild(e);
  }
  list.forEach((m) => {
    const mine = m.from === me.id;
    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'out' : 'in');
    if (current === 'public' && !mine) {
      const s = document.createElement('div');
      s.className = 'sender'; s.textContent = m.fromName; s.style.color = colorFor(m.fromName);
      div.appendChild(s);
    }
    if (m.deleted) {
      const d = document.createElement('div');
      d.className = 'text deleted'; d.textContent = '\u{1F6AB} This message was deleted';
      div.appendChild(d);
    } else {
      if (m.image) {
        const im = document.createElement('img');
        im.className = 'pic'; im.src = m.image; im.alt = 'Photo';
        im.onclick = () => { const w = window.open(); if (w) w.document.write('<img src="' + m.image + '" style="max-width:100%">'); };
        div.appendChild(im);
      }
      if (m.text) {
        const t = document.createElement('div');
        t.className = 'text'; t.textContent = m.text; // textContent = safe from XSS
        div.appendChild(t);
      }
    }
    const tm = document.createElement('div'); tm.className = 'time'; tm.textContent = fmtTime(m.time);
    if (mine && !m.deleted) {
      const x = document.createElement('button');
      x.className = 'del'; x.textContent = '\u{1F5D1}'; x.title = 'Delete for everyone';
      x.onclick = () => confirm('Delete this message for everyone?') && socket.emit('message:delete', { id: m.id, to: current === 'public' ? null : current });
      tm.prepend(x);
    }
    if (mine && m.to && !m.deleted) { // ticks only in private chats
      const k = document.createElement('span');
      k.className = 'tick' + (m.status === 'read' ? ' read' : ''); k.textContent = ' \u2713\u2713';
      tm.appendChild(k);
    }
    div.appendChild(tm);
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

/* ============ Opening a chat & sending ============ */
function openChat(key, silent) {
  current = key;
  unread[key] = 0;
  $('typing').textContent = '';
  $('app').classList.add('chat-open');
  if (silent && key === 'public') $('app').classList.remove('chat-open'); // phone: start on the list
  updateHeader();
  renderContacts();
  if (key === 'public') return renderMessages();
  socket.emit('history:private', key, (list) => {
    chats[key] = list;
    if (current === key) { renderMessages(); socket.emit('read', key); }
  });
  renderMessages();
  $('input').focus();
}
$('backBtn').onclick = () => $('app').classList.remove('chat-open');

function send() {
  const text = $('input').value.trim();
  if (!text) return;
  emitMsg(text);
  $('input').value = '';
}
function emitMsg(text, image) {
  if (current === 'public') socket.emit('message:public', { text, image });
  else socket.emit('message:private', { to: current, text, image });
}

// Emoji picker
'😀 😂 😍 😎 😢 😡 👍 🙏 🎉 ❤️ 🔥 😉 🤔 👏 😴 🥳'.split(' ').forEach((e) => {
  const b = document.createElement('button');
  b.textContent = e;
  b.onclick = () => { $('input').value += e; $('input').focus(); };
  $('emoji').appendChild(b);
});
$('emojiBtn').onclick = () => $('emoji').classList.toggle('hidden');

// Photo sharing
$('attachBtn').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f) return;
  if (f.size > 2e6) return alert('Please choose an image smaller than 2 MB.');
  const r = new FileReader();
  r.onload = () => emitMsg('', r.result);
  r.readAsDataURL(f);
};

// Notification sound
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 880; g.gain.value = 0.05;
    o.start(); o.stop(c.currentTime + 0.12);
  } catch (e) { /* sound is optional */ }
}

$('search').oninput = renderContacts;
$('sendBtn').onclick = send;
$('input').addEventListener('keydown', (e) => e.key === 'Enter' && send());
$('input').addEventListener('input', () => socket.emit('typing', current === 'public' ? null : current));

/* ============ Leave / auto-login ============ */
$('logout').onclick = () => {
  localStorage.removeItem('chat-token');
  location.reload();
};
$('theme').onclick = () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('chat-dark', document.body.classList.contains('dark') ? '1' : '');
};
if (localStorage.getItem('chat-dark')) document.body.classList.add('dark');

const saved = localStorage.getItem('chat-token');
if (saved) connect({ token: saved });
</script>
</body>
</html>
